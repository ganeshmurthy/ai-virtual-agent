{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "semantic-router.fullname" . }}-extproc
  labels:
    {{- include "semantic-router.extproc.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
    - name: api
      port: 8080
      targetPort: api
      protocol: TCP
    - name: metrics
      port: 9190
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "semantic-router.extproc.selectorLabels" . | nindent 4 }}
{{- end }}
