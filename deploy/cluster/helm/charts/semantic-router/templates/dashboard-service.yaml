{{- if and .Values.enabled .Values.dashboard.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "semantic-router.fullname" . }}-dashboard
  labels:
    {{- include "semantic-router.dashboard.labels" . | nindent 4 }}
spec:
  type: {{ .Values.dashboard.service.type }}
  ports:
    - name: http
      port: {{ .Values.dashboard.service.port }}
      targetPort: 8080
      protocol: TCP
  selector:
    {{- include "semantic-router.dashboard.selectorLabels" . | nindent 4 }}
{{- end }}
