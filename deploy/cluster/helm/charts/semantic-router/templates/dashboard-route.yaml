{{- if and .Values.enabled .Values.dashboard.enabled .Values.dashboard.route.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "semantic-router.fullname" . }}-dashboard
  labels:
    {{- include "semantic-router.dashboard.labels" . | nindent 4 }}
spec:
  {{- if .Values.dashboard.route.host }}
  host: {{ .Values.dashboard.route.host }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "semantic-router.fullname" . }}-dashboard
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
{{- end }}
