{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "semantic-router.fullname" . }}-config
  labels:
    {{- include "semantic-router.labels" . | nindent 4 }}
data:
  config.yaml: |
    version: {{ .Values.config.version | quote }}

    providers:
      models:
        {{- range .Values.config.providers.models }}
        - name: {{ .name }}
          backend_refs:
            {{- range .backend_refs }}
            - endpoint: {{ .endpoint }}
            {{- end }}
        {{- end }}

    decisions:
      {{- range .Values.config.decisions }}
      - name: {{ .name }}
        priority: {{ .priority }}
        rules:
          conditions:
            {{- range .rules.conditions }}
            - type: {{ .type }}
              {{- if .name }}
              name: {{ .name | quote }}
              {{- end }}
              {{- if .threshold }}
              threshold: {{ .threshold }}
              {{- end }}
            {{- end }}
        {{- if .modelRefs }}
        modelRefs:
          {{- range .modelRefs }}
          - model: {{ .model }}
            {{- if .use_reasoning }}
            use_reasoning: {{ .use_reasoning }}
            {{- end }}
            {{- if .system_prompt_append }}
            system_prompt_append: {{ .system_prompt_append | quote }}
            {{- end }}
          {{- end }}
        {{- end }}
        {{- if .response }}
        response:
          type: {{ .response.type }}
          {{- if .response.content }}
          content: {{ .response.content | quote }}
          {{- end }}
        {{- end }}
      {{- end }}

    signals:
      {{- if .Values.config.signals.keywords }}
      keywords:
        {{- range $name, $config := .Values.config.signals.keywords }}
        {{ $name }}:
          terms:
            {{- range $config.terms }}
            - {{ . | quote }}
            {{- end }}
          algorithm: {{ $config.algorithm }}
          threshold: {{ $config.threshold }}
        {{- end }}
      {{- end }}
      {{- if .Values.config.signals.jailbreak }}
      jailbreak:
        model: {{ .Values.config.signals.jailbreak.model }}
        threshold: {{ .Values.config.signals.jailbreak.threshold }}
      {{- end }}
      {{- if .Values.config.signals.pii }}
      pii:
        model: {{ .Values.config.signals.pii.model }}
        threshold: {{ .Values.config.signals.pii.threshold }}
      {{- end }}
{{- end }}
