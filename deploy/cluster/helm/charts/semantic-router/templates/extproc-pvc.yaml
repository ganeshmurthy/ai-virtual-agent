{{- if and .Values.enabled .Values.extproc.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "semantic-router.fullname" . }}-extproc-cache
  labels:
    {{- include "semantic-router.extproc.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.extproc.persistence.size }}
  {{- if .Values.extproc.persistence.storageClass }}
  storageClassName: {{ .Values.extproc.persistence.storageClass }}
  {{- end }}
{{- end }}
