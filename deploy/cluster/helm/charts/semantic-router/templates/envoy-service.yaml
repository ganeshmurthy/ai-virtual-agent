{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "semantic-router.fullname" . }}-envoy
  labels:
    {{- include "semantic-router.envoy.labels" . | nindent 4 }}
spec:
  type: {{ .Values.envoy.service.type }}
  ports:
    - name: proxy
      port: {{ .Values.envoy.service.port }}
      targetPort: proxy
      protocol: TCP
  selector:
    {{- include "semantic-router.envoy.selectorLabels" . | nindent 4 }}
{{- end }}
