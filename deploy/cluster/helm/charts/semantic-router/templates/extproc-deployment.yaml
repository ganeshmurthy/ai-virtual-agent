{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "semantic-router.fullname" . }}-extproc
  labels:
    {{- include "semantic-router.extproc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.extproc.replicas }}
  selector:
    matchLabels:
      {{- include "semantic-router.extproc.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "semantic-router.extproc.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: extproc
          image: "{{ .Values.extproc.image.repository }}:{{ .Values.extproc.image.tag }}"
          imagePullPolicy: {{ .Values.extproc.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: api
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9190
              protocol: TCP
          env:
            - name: CONFIG_PATH
              value: /config/config.yaml
            {{- if .Values.hfToken }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "semantic-router.fullname" . }}-hf-token
                  key: token
            {{- end }}
            - name: MODEL_CACHE_DIR
              value: /cache
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            {{- if .Values.extproc.persistence.enabled }}
            - name: cache
              mountPath: /cache
            {{- end }}
          resources:
            {{- toYaml .Values.extproc.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: api
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: api
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: {{ include "semantic-router.fullname" . }}-config
        {{- if .Values.extproc.persistence.enabled }}
        - name: cache
          persistentVolumeClaim:
            claimName: {{ include "semantic-router.fullname" . }}-extproc-cache
        {{- end }}
{{- end }}
