# Semantic Router configuration
enabled: true

# Hugging Face token for downloading models (mmBERT for domain classification)
hfToken: ""

# ExtProc (External Processor) - handles routing decisions
extproc:
  image:
    repository: ghcr.io/vllm-project/semantic-router/extproc
    tag: "v0.3.0"
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: "2"
      memory: "4Gi"
    limits:
      cpu: "4"
      memory: "8Gi"
  # PVC for caching downloaded models (mmBERT)
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""

# Envoy Proxy - intercepts requests and calls ExtProc
envoy:
  image:
    repository: docker.io/envoyproxy/envoy
    tag: "v1.31-latest"
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
  service:
    port: 8801
    type: ClusterIP

# Dashboard (optional) - visualize routing decisions
dashboard:
  enabled: true
  image:
    repository: ghcr.io/vllm-project/semantic-router/dashboard
    tag: "v0.3.0"
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  service:
    port: 8080
    type: ClusterIP
  route:
    enabled: true
    host: ""  # Auto-generated if empty

# Routing configuration
config:
  version: "v0.3"

  # Model providers - backend vLLM endpoints
  providers:
    models:
      - name: fast-agent
        backend_refs:
          - endpoint: llm-fast:8000
      - name: smart-agent
        backend_refs:
          - endpoint: llm-smart:8000

  # Routing decisions (priority: higher = evaluated first)
  decisions:
    # Block jailbreak attempts (highest priority)
    - name: blocked
      priority: 100
      rules:
        conditions:
          - type: jailbreak
            threshold: 0.7
      response:
        type: static
        content: "I cannot assist with that request."

    # Flag PII and inject safety prompt
    - name: pii-flagged
      priority: 90
      rules:
        conditions:
          - type: pii
            threshold: 0.6
      modelRefs:
        - model: smart-agent
          system_prompt_append: "IMPORTANT: The user message may contain personally identifiable information. Do not repeat or store any sensitive data like SSNs, credit cards, or addresses."

    # Complex RAG queries to 8B model
    - name: rag-synthesis
      priority: 20
      rules:
        conditions:
          - type: keywords
            name: rag-keywords
      modelRefs:
        - model: smart-agent
          use_reasoning: true

    # Document processing to 8B model
    - name: document-analysis
      priority: 15
      rules:
        conditions:
          - type: keywords
            name: document-keywords
      modelRefs:
        - model: smart-agent

    # Simple queries to fast 2B/3B model (lowest priority = default)
    - name: fast-response
      priority: 1
      rules:
        conditions:
          - type: keywords
            name: simple-intents
      modelRefs:
        - model: fast-agent

  # Signal definitions
  signals:
    keywords:
      # Simple chitchat and FAQs
      simple-intents:
        terms:
          - hello
          - hi
          - thanks
          - thank you
          - goodbye
          - bye
          - help
          - what can you do
          - capabilities
          - features
        algorithm: bm25
        threshold: 0.3

      # RAG/retrieval keywords
      rag-keywords:
        terms:
          - summarize
          - summary
          - retrieve
          - search knowledge base
          - find in documents
          - according to the document
          - based on the knowledge base
        algorithm: bm25
        threshold: 0.4

      # Document processing keywords
      document-keywords:
        terms:
          - analyze document
          - extract from pdf
          - parse document
          - compliance rules
          - policy requirements
          - contract terms
        algorithm: bm25
        threshold: 0.4

    # Jailbreak detection (uses mmBERT classifier)
    jailbreak:
      model: jailbreak-classifier
      threshold: 0.7

    # PII detection (uses mmBERT classifier)
    pii:
      model: pii-detector
      threshold: 0.6

    # Domain classification (uses mmBERT with MMLU categories)
    # Uncomment to enable domain-based routing
    # domains:
    #   - "computer science"
    #   - "mathematics"
    #   - "biology"
    #   - "history"
