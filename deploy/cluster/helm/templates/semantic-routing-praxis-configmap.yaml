{{- if .Values.semanticRouting.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-virtual-agent.fullname" . }}-praxis-config
  labels:
    {{- include "ai-virtual-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: semantic-routing-praxis
data:
  config.yaml: |
    admin:
      address: "0.0.0.0:9901"
      verbose: true

    insecure_options:
      allow_public_admin: true
      allow_private_upstreams: true

    listeners:
      - name: ai-gateway
        address: 0.0.0.0:8080
        filter_chains: [main]

    filter_chains:
      - name: main
        filters:
          - filter: request_id
          - filter: llm_d_sc
            endpoint: {{ include "ai-virtual-agent.fullname" . }}-llm-d-sc:50051
            default_cluster: large-model
            routes:
              - label: SMALL
                cluster: small-model
              - label: LARGE
                cluster: large-model
            timeout_ms: 1000
            connect_timeout_ms: 5000
            max_prompt_chars: 4096
            max_body_bytes: 1048576
            min_score: 0.0
            on_unavailable: default_cluster
            on_resource_exhausted: default_cluster
            status_on_reject: 503
            emit_headers: true
          {{- if .Values.semanticRouting.largeModel.apiKey }}
          - filter: headers
            request_add:
              - name: "Authorization"
                value: "Bearer {{ .Values.semanticRouting.largeModel.apiKey }}"
          {{- end }}
          - filter: load_balancer
            clusters:
              - name: small-model
                load_balancer_strategy: round_robin
                connection_timeout_ms: 5000
                read_timeout_ms: 30000
                endpoints:
                  - "{{ include "ai-virtual-agent.fullname" . }}-small-model:8000"

              - name: large-model
                load_balancer_strategy: round_robin
                connection_timeout_ms: 5000
                read_timeout_ms: 30000
                {{- if .Values.semanticRouting.largeModel.url }}
                {{- $url := .Values.semanticRouting.largeModel.url }}
                {{- $url = $url | trimPrefix "http://" | trimPrefix "https://" | trimSuffix "/v1" }}
                {{- $hostname := $url }}
                {{- if contains ":" $url }}
                {{- $hostname = $url | splitList ":" | first }}
                {{- end }}
                {{- if hasPrefix "https://" .Values.semanticRouting.largeModel.url }}
                tls:
                  sni: "{{ $hostname }}"
                {{- end }}
                http:
                  authority: "{{ $hostname }}"
                {{- end }}
                endpoints:
                  {{- if .Values.semanticRouting.largeModel.url }}
                  {{- $url := .Values.semanticRouting.largeModel.url }}
                  {{- $url = $url | trimPrefix "http://" | trimPrefix "https://" | trimSuffix "/v1" }}
                  {{- if not (contains ":" $url) }}
                  - "{{ $url }}:443"
                  {{- else }}
                  - "{{ $url }}"
                  {{- end }}
                  {{- else }}
                  - "placeholder-large-model:8000"
                  {{- end }}
{{- end }}
