{{- if .Values.semanticRouting.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-virtual-agent.fullname" . }}-praxis
  labels:
    {{- include "ai-virtual-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: semantic-routing-praxis
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
  - name: admin
    port: 9901
    targetPort: admin
    protocol: TCP
  selector:
    {{- include "ai-virtual-agent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: semantic-routing-praxis
{{- end }}
